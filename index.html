<title>BizKid Markets — Private Preview</title>
<meta name="robots" content="noindex, nofollow">

<style>
  :root{--bg:#FFF7EA;--ink:#26324B;--yellow:#FFC93C;--teal:#2EC4B6;--coral:#FF6B6B;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .lock-card{background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);padding:40px 36px;max-width:420px;width:100%;text-align:center}
  .lock-emoji{font-size:52px;margin-bottom:14px}
  h1{font-family:'Baloo 2';font-size:26px;font-weight:800;margin-bottom:8px}
  p{font-size:14px;color:#7A8599;line-height:1.6;margin-bottom:22px}
  input{width:100%;border:3px solid var(--ink);border-radius:14px;padding:13px 16px;font-size:16px;font-family:inherit;font-weight:600;text-align:center;margin-bottom:14px}
  input:focus{outline:none;border-color:var(--teal)}
  button{width:100%;border:3px solid var(--ink);border-radius:14px;background:var(--yellow);padding:13px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:.1s}
  button:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
  button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .err{color:var(--coral);font-weight:700;font-size:13.5px;min-height:20px;margin-top:12px}
  .foot{font-size:11.5px;color:#7A8599;margin-top:18px}
</style>
</head>

  <input type="password" id="pw" placeholder="Password" autofocus onkeydown="if(event.key==='Enter')unlock()">
  <button onclick="unlock()">Unlock</button>

  if(!pw){ err.textContent = 'Type the password first!'; return; }

  try{
    const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);

    err.textContent = 'Wrong password — try again.';
